<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZTE F672Y • CPE Gateway Access Control</title>
  <style>
    :root {
      --bg: #080a0e; --surface: #0e1218; --inset: #131821; --hover: #19202c;
      --border: #1e2633; --border-hi: #2b3648; --text: #f1f5f9; --sub: #94a3b8;
      --muted: #64748b; --cyan: #38bdf8; --green: #10b981; --red: #ef4444; --amber: #f59e0b;
      --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); padding: 14px; }
    .wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--cyan); text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: 16px; font-weight: 700; }
    .status { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--sub); background: var(--inset); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .dot.err { background: var(--red); }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .kpi { background: var(--inset); border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: 6px; padding: 9px 10px; }
    .kpi-lbl { font-family: var(--mono); font-size: 9.5px; font-weight: 600; color: var(--muted); }
    .kpi-val { font-family: var(--mono); font-size: 20px; font-weight: 700; margin-top: 2px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--inset); border: 1px solid var(--border-hi); color: var(--text); font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 5px; cursor: pointer; }
    .btn-primary { background: #1d4ed8; border-color: #2563eb; color: #fff; }
    .btn-danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.34); color: #fca5a5; }
    .btn-success { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.36); color: #6ee7b7; }
    .dev { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid #334155; border-radius: 6px; padding: 11px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .dev.on { border-left-color: var(--green); }
    .dev.blk { background: #120d10; border-color: rgba(239,68,68,0.28); border-left-color: var(--red); }
    .badge { font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
    .b-on { background: rgba(16,185,129,0.1); color: #34d399; }
    .b-off { background: rgba(100,116,139,0.12); color: #94a3b8; }
    .b-blk { background: rgba(239,68,68,0.14); color: #f87171; }
    .meta { font-family: var(--mono); font-size: 11px; color: var(--sub); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <div class="eyebrow">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="14" width="20" height="6" rx="1.5"/><path d="M6 14v-3M18 14v-3"/></svg>
            CPE GATEWAY • 192.168.1.1
          </div>
          <h1>ZTE F672Y Access Control</h1>
          <div class="status"><span class="dot" id="st-dot"></span><span id="router-status">Menghubungkan...</span></div>
        </div>
        <button class="btn btn-primary" id="btn-scan">Pindai</button>
      </div>
      <div class="kpis">
        <div class="kpi" style="--accent:#10b981"><div class="kpi-lbl">AKTIF</div><div class="kpi-val" id="st-online">0</div></div>
        <div class="kpi" style="--accent:#ef4444"><div class="kpi-lbl">ACL BLOKIR</div><div class="kpi-val" id="st-blocked">0</div></div>
        <div class="kpi" style="--accent:#38bdf8"><div class="kpi-lbl">TOTAL CLIENT</div><div class="kpi-val" id="st-total">0</div></div>
      </div>
    </div>
    <div id="device-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
  <script>
    let isToggling = false;
    function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
    async function apiPost(path, payload) {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "Permintaan gagal");
      render(j);
    }
    async function fetchState() {
      try { const r = await fetch("/api/state"); render(await r.json()); } catch (e) { console.error(e); }
    }
    window.toggleBlock = async function(mac, nextState) {
      if (isToggling) return;
      isToggling = true;
      document.querySelectorAll("#device-list button").forEach(b => b.disabled = true);
      try { await apiPost("/api/device/block", { mac, block: nextState === 1 }); }
      catch (e) { alert("Gagal: " + e.message); await fetchState(); }
      finally { isToggling = false; }
    };
    function render(data) {
      const devs = data.devices || [];
      document.getElementById("st-online").textContent = devs.filter(d => d.status === "online").length;
      document.getElementById("st-blocked").textContent = devs.filter(d => d.block_mode === "blocked").length;
      document.getElementById("st-total").textContent = devs.length;
      const dot = document.getElementById("st-dot");
      dot.classList.toggle("err", !data.state?.routerOnline);
      document.getElementById("router-status").textContent = data.state?.routerOnline
        ? "TERHUBUNG • SYNC " + new Date(data.state.lastScanAt).toLocaleTimeString("id-ID")
        : (data.state?.lastError || "TERPUTUS");
      document.getElementById("device-list").innerHTML = devs.map(d => {
        const isBlk = d.block_mode === "blocked";
        const isOn = d.status === "online";
        return '<div class="dev ' + (isBlk ? "blk" : (isOn ? "on" : "")) + '">' +
          '<div><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
          '<strong style="font-size:13.5px">' + esc(d.alias || d.hostname) + '</strong>' +
          '<span class="badge ' + (isOn ? "b-on" : "b-off") + '">' + (isOn ? "ONLINE" : "OFFLINE") + '</span>' +
          (isBlk ? '<span class="badge b-blk">ACL DENY</span>' : '') +
          '</div><div class="meta">' + esc(d.ip) + ' / ' + esc((d.mac || "").toUpperCase()) + ' / ' + esc(d.conn_type) + '</div></div>' +
          '<button class="btn ' + (isBlk ? "btn-success" : "btn-danger") + '" onclick="toggleBlock(\'' + esc(d.mac) + '\',' + (isBlk ? 0 : 1) + ')">' +
          (isBlk ? "Pulihkan" : "Blokir") + '</button></div>';
      }).join("");
    }
    document.getElementById("btn-scan").addEventListener("click", () => apiPost("/api/scan", {}));
    fetchState();
    setInterval(() => { if (!isToggling) fetchState(); }, 6000);
  </script>
</body>
</html>
