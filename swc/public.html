<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTE F672Y Gateway Control</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

    :root {
      --bg-canvas: #0d1117;
      --bg-surface: #161b22;
      --bg-subtle: #21262d;
      --border-default: #30363d;
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --status-rose: #f85149;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 900px; margin: 0 auto; }
    
    .panel-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-default);
      padding-bottom: 8px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      padding: 12px;
    }
    .stat-label { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
    .stat-val { font-size: 20px; font-weight: 700; font-family: var(--font-mono); color: var(--accent-cyan); margin-top: 4px; }

    .device-list { display: flex; flex-direction: column; gap: 8px; }
    
    .device-item {
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .device-info { display: flex; flex-direction: column; gap: 2px; }
    .device-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .device-meta { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }

    .btn-action {
      padding: 6px 12px;
      font-size: 11px;
      font-family: var(--font-sans);
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .btn-deny {
      background: rgba(248, 81, 73, 0.15);
      border-color: rgba(248, 81, 73, 0.3);
      color: var(--status-rose);
    }
    .btn-deny:hover { background: rgba(248, 81, 73, 0.3); }

    .btn-allow {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--accent-emerald);
    }
    .btn-allow:hover { background: rgba(16, 185, 129, 0.3); }

    .badge-blocked {
      font-size: 9px;
      font-family: var(--font-mono);
      background: rgba(248, 81, 73, 0.2);
      color: var(--status-rose);
      border: 1px solid var(--status-rose);
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel-card">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="var(--accent-cyan)"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0z"/></svg>
          ZTE F672Y Gateway NOC Panel
        </div>
        <button onclick="loadDevices()" class="btn-action" style="background:var(--bg-subtle); color:var(--text-secondary); border:1px solid var(--border-default);">
          🔄 Rescan ARP
        </button>
      </div>

      <div class="grid-stats">
        <div class="stat-box">
          <div class="stat-label">ACTIVE CLIENTS</div>
          <div class="stat-val" id="statActive">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">ACL FILTERED</div>
          <div class="stat-val" id="statBlocked" style="color:var(--status-rose)">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">ROUTER STATUS</div>
          <div class="stat-val" style="color:var(--accent-emerald); font-size:14px; margin-top:8px;">ONLINE (F672Y)</div>
        </div>
      </div>

      <div class="panel-title" style="margin-bottom:8px;">SUBNET NODES</div>
      <div id="deviceList" class="device-list">
        <div style="font-size:12px; color:var(--text-muted); font-family:var(--font-mono);">Memuat daftar perangkat terhubung...</div>
      </div>
    </div>
  </div>

  <script>
    async function loadDevices() {
      const container = document.getElementById("deviceList");
      try {
        const res = await fetch("/api/swc/devices");
        const data = await res.json();
        
        let blockedCount = 0;
        container.innerHTML = "";

        if (!data.devices || data.devices.length === 0) {
          container.innerHTML = `<div style="font-size:12px; color:var(--text-muted); font-family:var(--font-mono);">Tidak ada perangkat terdeteksi.</div>`;
          return;
        }

        document.getElementById("statActive").innerText = data.devices.length;

        data.devices.forEach(dev => {
          const isBlocked = dev.block_mode === "blocked";
          if (isBlocked) blockedCount++;

          const item = document.createElement("div");
          item.className = "device-item";
          item.innerHTML = `
            <div class="device-info">
              <div class="device-name">
                ${dev.hostname || "Perangkat Tanpa Nama"}
                ${isBlocked ? '<span class="badge-blocked">ACL DENY</span>' : ''}
              </div>
              <div class="device-meta">${dev.ip} • ${dev.mac} • ${dev.conn_type || 'WLAN'}</div>
            </div>
            <div>
              <button onclick="toggleBlock('${dev.mac}', ${isBlocked})" class="btn-action ${isBlocked ? 'btn-allow' : 'btn-deny'}">
                ${isBlocked ? 'Restore Access' : 'Deny Access'}
              </button>
            </div>
          `;
          container.appendChild(item);
        });

        document.getElementById("statBlocked").innerText = blockedCount;
      } catch (err) {
        container.innerHTML = `<div style="font-size:12px; color:var(--status-rose); font-family:var(--font-mono);">Gagal terhubung ke backend server lokal.</div>`;
      }
    }

    async function toggleBlock(mac, isBlocked) {
      const action = isBlocked ? "allow" : "block";
      try {
        const res = await fetch(`/api/swc/devices/${encodeURIComponent(mac)}/${action}`, { method: "POST" });
        const data = await res.json();
        if (data.ok) {
          loadDevices();
        } else {
          alert("Gagal memperbarui ACL Router: " + (data.error || "Unknown Error"));
        }
      } catch (err) {
        alert("Error koneksi backend: " + err.message);
      }
    }

    loadDevices();
  </script>
</body>
</html>
