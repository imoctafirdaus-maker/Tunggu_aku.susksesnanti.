<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOC Gateway · ZTE F672Y ACL Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-main: #060911;
      --panel-bg: #0d1322;
      --panel-border: rgba(255, 255, 255, 0.07);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #6b7280;
      --status-emerald: #10b981;
      --status-rose: #f43f5e;
      --status-amber: #f59e0b;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 38px; height: 38px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-cyan);
    }

    .brand-title { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; }
    .brand-subtitle { font-size: 10px; font-family: var(--font-mono); color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.08em; }

    .pulse-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; background: rgba(255,255,255,0.03);
      border: 1px solid var(--panel-border); border-radius: 20px;
      font-size: 11px; font-family: var(--font-mono); color: var(--text-muted);
    }
    .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status-emerald); box-shadow: 0 0 10px var(--status-emerald); }
    .pulse-dot.err { background: var(--status-rose); box-shadow: 0 0 10px var(--status-rose); }

    /* KPI Grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .kpi-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 12px 14px;
      position: relative; overflow: hidden;
    }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; }
    .kpi-card.cyan::before { background: var(--accent-cyan); }
    .kpi-card.emerald::before { background: var(--status-emerald); }
    .kpi-card.rose::before { background: var(--status-rose); }

    .kpi-label { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .kpi-value { font-size: 22px; font-weight: 800; margin-top: 4px; font-family: var(--font-mono); }

    /* Action Controls */
    .control-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding: 0 2px;
    }
    .section-title { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
      border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease;
      font-family: var(--font-sans);
    }
    .btn-sync { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
    .btn-sync:hover { background: rgba(59, 130, 246, 0.22); }
    .btn-deny { background: rgba(244, 63, 94, 0.12); color: #fb7185; border-color: rgba(244, 63, 94, 0.3); }
    .btn-deny:hover { background: rgba(244, 63, 94, 0.22); }
    .btn-allow { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    .btn-allow:hover { background: rgba(16, 185, 129, 0.22); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Device List Cards */
    .device-list { display: flex; flex-direction: column; gap: 8px; }
    .device-row {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 14px;
      display: flex; justify-content: space-between; align-items: center;
      transition: border-color 0.2s;
    }
    .device-row:hover { border-color: rgba(255, 255, 255, 0.15); }
    .device-row.blocked { border-left: 3px solid var(--status-rose); }
    .device-row.online { border-left: 3px solid var(--status-emerald); }

    .dev-details { display: flex; flex-direction: column; gap: 4px; }
    .dev-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .dev-hostname { font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em; }

    .pill {
      font-size: 9px; font-family: var(--font-mono); font-weight: 700;
      padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .pill-online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .pill-offline { background: rgba(107, 114, 128, 0.15); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.3); }
    .pill-deny { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    .dev-subtext {
      font-size: 11px; font-family: var(--font-mono); color: var(--text-muted);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }

    #error-banner {
      display: none; padding: 12px 14px; background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 8px; color: #fca5a5;
      font-size: 12px; font-family: var(--font-mono); margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div class="header-bar">
    <div class="brand-group">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
      <div>
        <div class="brand-subtitle">ISP CONTROL CORE</div>
        <div class="brand-title">ZTE F672Y Gateway</div>
      </div>
    </div>
    <div class="pulse-badge">
      <span class="pulse-dot" id="st-dot"></span>
      <span id="router-status">LINK SYNC</span>
    </div>
  </div>

  <div id="error-banner"></div>

  <!-- KPI Metrics -->
  <div class="kpi-grid">
    <div class="kpi-card emerald">
      <div class="kpi-label">Active Clients</div>
      <div class="kpi-value" id="st-online" style="color: var(--status-emerald);">0</div>
    </div>
    <div class="kpi-card rose">
      <div class="kpi-label">ACL Filtered</div>
      <div class="kpi-value" id="st-blocked" style="color: var(--status-rose);">0</div>
    </div>
    <div class="kpi-card cyan">
      <div class="kpi-label">Total Leases</div>
      <div class="kpi-value" id="st-total" style="color: var(--accent-cyan);">0</div>
    </div>
  </div>

  <!-- Control Toolbar -->
  <div class="control-toolbar">
    <div class="section-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      Subnet Nodes
    </div>
    <button class="btn btn-sync" id="btn-scan" onclick="triggerScan()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      Rescan ARP
    </button>
  </div>

  <!-- Device Table Container -->
  <div class="device-list" id="device-list">
    <div style="text-align:center; padding:40px; color:var(--text-muted); font-size:12px; font-family:var(--font-mono);">
      Querying router ARP table...
    </div>
  </div>

  <script>
    let isToggling = false;
    function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

    async function fetchState() {
      try {
        const r = await fetch("/api/state?t=" + Date.now());
        if (!r.ok) throw new Error("API HTTP " + r.status);
        const data = await r.json();
        document.getElementById("error-banner").style.display = "none";
        render(data);
      } catch (e) {
        console.error(e);
        const errDiv = document.getElementById("error-banner");
        errDiv.style.display = "block";
        errDiv.textContent = "CRITICAL: Gateway offline or session lost [" + e.message + "]";
        document.getElementById("router-status").textContent = "DISCONNECTED";
        document.getElementById("st-dot").className = "pulse-dot err";
      }
    }

    async function triggerScan() {
      const btn = document.getElementById("btn-scan");
      btn.disabled = true;
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Scanning...`;
      try {
        const r = await fetch("/api/scan", { method: "POST", headers: { "Content-Type": "application/json" } });
        const j = await r.json(); render(j);
      } catch (e) { alert("Scan execution failed: " + e.message); }
      finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg> Rescan ARP`;
      }
    }

    async function toggleBlock(mac, nextState) {
      if (isToggling) return;
      isToggling = true;
      document.querySelectorAll("#device-list button").forEach(b => b.disabled = true);
      try {
        const r = await fetch("/api/device/block", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mac, block: nextState === 1 })
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "ACL write failed");
        render(j);
      } catch (e) {
        alert("ACL Policy Error: " + e.message);
        await fetchState();
      } finally { isToggling = false; }
    }

    function render(data) {
      const devs = data.devices || [];
      document.getElementById("st-online").textContent = devs.filter(d => d.status === "online").length;
      document.getElementById("st-blocked").textContent = devs.filter(d => d.block_mode === "blocked").length;
      document.getElementById("st-total").textContent = devs.length;

      const dot = document.getElementById("st-dot");
      const rOnline = data.state?.routerOnline;
      dot.className = "pulse-dot" + (rOnline ? "" : " err");
      document.getElementById("router-status").textContent = rOnline
        ? "ONLINE • " + new Date(data.state.lastScanAt || Date.now()).toLocaleTimeString("id-ID")
        : (data.state?.lastError || "DISCONNECTED");

      const listEl = document.getElementById("device-list");
      if (!devs.length) {
        listEl.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:12px; font-family:var(--font-mono);">No active clients found in lease table.</div>';
        return;
      }

      listEl.innerHTML = devs.map(d => {
        const isBlk = d.block_mode === "blocked";
        const isOn = d.status === "online";
        return `
          <div class="device-row ${isBlk ? "blocked" : (isOn ? "online" : "")}">
            <div class="dev-details">
              <div class="dev-header">
                <span class="dev-hostname">${esc(d.alias || d.hostname)}</span>
                <span class="pill ${isOn ? "pill-online" : "pill-offline"}">${isOn ? "ONLINE" : "OFFLINE"}</span>
                ${isBlk ? '<span class="pill pill-deny">ACL DENY</span>' : ''}
              </div>
              <div class="dev-subtext">
                <span>${esc(d.ip)}</span>
                <span>•</span>
                <span>${esc((d.mac || "").toUpperCase())}</span>
                <span>•</span>
                <span>${esc(d.conn_type || "WLAN")}</span>
              </div>
            </div>
            <button class="btn ${isBlk ? "btn-allow" : "btn-deny"}" onclick="toggleBlock('${esc(d.mac)}', ${isBlk ? 0 : 1})">
              ${isBlk ? `
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                Restore Access
              ` : `
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                Deny Access
              `}
            </button>
          </div>
        `;
      }).join("");
    }

    fetchState();
    setInterval(() => { if (!isToggling) fetchState(); }, 5000);
  </script>
</body>
</html>
