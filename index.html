    html, body { overflow-x: hidden; width: 100%; max-width: 100vw; background: #09090e; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #e2e8f0; }

    @keyframes progress-animation { from { background-position: 1rem 0; } to { background-position: 0 0; } }

<body class="min-h-screen flex items-start justify-center p-2 sm:p-4">

    </div>

    <!-- AI QUANT ENGINE (HARMONIC M30) -->
    <div class="glass-panel rounded-2xl p-4 sm:p-5 border border-white/5 space-y-4">
      
      <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 border-b border-white/10 pb-4">
        <div class="flex items-center gap-2 mt-2">
          <span class="text-yellow-400 font-semibold tracking-wider pixel-font text-[10px] bg-yellow-500/10 px-2 py-0.5 rounded border border-yellow-500/20">VISION M30</span>
          <h2 class="text-white font-bold text-base tracking-wide uppercase flex items-center gap-2">
            <i data-lucide="hexagon" class="w-5 h-5 text-yellow-400"></i> AI Harmonic Engine

        <div class="flex flex-col gap-2 max-w-sm w-full font-mono">

                <div class="flex items-center gap-2 bg-black/60 px-3 py-1.5 rounded-xl border border-white/10 w-2/5 transition-colors focus-within:border-blue-500/50">

      </div>

      <div class="w-full flex justify-between items-center bg-[#0d0d12] border border-white/5 rounded-xl p-2 px-4 mb-4">
          <div class="text-[10px] font-mono text-gray-400 flex items-center gap-4 hidden sm:flex">
             <span id="mon-tokens" class="text-blue-400">Mode: Strict Harmonic</span>
             <span id="mon-latency" class="text-yellow-400">Latency: <span id="mon-latency-val">-</span></span>

      <div class="bg-black/30 p-4 rounded-xl border border-white/5 mb-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-3">
          <div class="flex gap-4 font-mono text-[10px] font-bold tracking-wider flex-wrap" id="tf-checklists">
            <div id="check-m30" class="flex items-center gap-1.5 text-gray-600 transition-colors"><i data-lucide="circle" class="w-3 h-3"></i> M30 CHART</div>
          </div>

             <div class="text-[9px] text-gray-500 uppercase tracking-widest mb-1">Scanner Readiness</div>

           <div id="readiness-bar" class="bg-blue-500 h-full w-0 transition-all duration-700 ease-out shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>

      <!-- SINGLE UPLOAD GRID FOR M30 -->

      <!-- FINAL REPORT CONTAINER -->
      <div id="final-report-container" class="hidden bg-zinc-900/80 p-5 rounded-xl border border-blue-500/30 neon-border-green mt-6 transition-all duration-500 opacity-0 transform translate-y-4">
        <div class="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
            <span class="text-xs uppercase font-bold text-blue-400 tracking-wider flex items-center gap-2">
              <i data-lucide="scan-line" class="w-4 h-4"></i> Harmonic Validation Report
            </span>
            <span class="text-[9px] font-bold font-mono px-2 py-1 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">M30 ANALYZED</span>
        </div>
        
        <div id="report-content" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-mono text-gray-300">
        </div>
      </div>

    </div>
  </div>

  <script>
    // =========================================================================
    // SYSTEM CORE 
    // =========================================================================
    class SmartLRUCache {
        constructor(maxSize = 20, ttlMs = 15 * 60 * 1000) { this.cache = new Map(); this.maxSize = maxSize; this.ttlMs = ttlMs; }
        get(key) { if (!this.cache.has(key)) return null; const item = this.cache.get(key); if (Date.now() > item.expiry) { this.cache.delete(key); return null; } this.cache.delete(key); this.cache.set(key, item); return item.value; }
        set(key, value) { if (this.cache.has(key)) this.cache.delete(key); if (this.cache.size >= this.maxSize) this.cache.delete(this.cache.keys().next().value); this.cache.set(key, { value, expiry: Date.now() + this.ttlMs }); }
    }

    const MarketConfirmationEngine = {
        cache: new SmartLRUCache(50, 60 * 1000), 
        async getRealtimeData(symbol, rapidApiKey) {
            if (!rapidApiKey || !symbol) return null;
            const cleanSymbol = symbol.trim().toUpperCase(); const cacheKey = `tv_data_${cleanSymbol}`; const cached = this.cache.get(cacheKey);
            if (cached) { this.updateUIStatus(true, true); return cached; }
            const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 10000); 
            try {
                const url = `https://tradingview-data1.p.rapidapi.com/api/price/${cleanSymbol}?timeframe=1&range=10`;
                const response = await fetch(url, { method: 'GET', headers: { 'x-rapidapi-host': 'tradingview-data1.p.rapidapi.com', 'x-rapidapi-key': rapidApiKey.trim() }, signal: controller.signal });
                clearTimeout(timeoutId); if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json(); const formatted = this.formatData(cleanSymbol, data); this.cache.set(cacheKey, formatted);
                this.updateUIStatus(true, false); return formatted;
            } catch (error) { clearTimeout(timeoutId); this.updateUIStatus(false, false); return null; }
        },
        formatData(requestSymbol, data) { const price = data.price !== undefined ? data.price : 'N/A'; return `=== TRADINGVIEW REAL-TIME MARKET DATA ===\nTarget Asset  : ${data.symbol || requestSymbol}\nCurrent Price : ${price}\n=========================================`; },
        updateUIStatus(isSuccess, isCached) { const el = document.getElementById('mon-rapidapi'); if (!el) return; if (isSuccess) { el.innerHTML = `<i data-lucide="zap" class="w-3 h-3 inline text-yellow-400"></i> TV Realtime: ${isCached ? 'CACHED' : 'LIVE'}`; el.className = "text-green-400 font-bold"; } else { el.innerHTML = `<i data-lucide="wifi-off" class="w-3 h-3 inline"></i> TV Realtime: FAILED`; el.className = "text-red-400"; } if(window.lucide) lucide.createIcons(); }
    };

    // =========================================================================
    // HARMONIC AI ENGINE
    // =========================================================================
    const AI_Quant_Engine = {
      config: {
        timeoutMs: 45000,
        maxImageDimension: 1200,
        imageQuality: 0.8,
        providers: [{ id: "gemini", baseURL: "https://generativelanguage.googleapis.com/v1beta" }]
      },

      state: {
        apiKey: '', rapidApiKey: '', targetSymbol: 'BINANCE:BTCUSDT', activeModel: null,
        timeframes: [ { id: 'm30', label: 'M30', title: 'M30 TIMEFRAME' } ],
        tfImages: { m30: null }, 
        tfMemory: { m30: null }, 
        tfStatus: { m30: 'Empty' }, 
        tfControllers: { m30: null }
      },

      init() {
        const apiKeyInput = document.getElementById('gemini-api-key');
        const rapidApiInput = document.getElementById('rapid-api-key');
        const symbolInput = document.getElementById('target-symbol');

        const savedGemini = sessionStorage.getItem('_sys_qt_auth');
        const savedRapid = sessionStorage.getItem('_sys_rapid_auth');
        const savedSymbol = sessionStorage.getItem('_sys_target_sym');

        if (savedGemini) { apiKeyInput.value = atob(savedGemini); this.state.apiKey = atob(savedGemini); this.initializeRouter(); }
        if (savedRapid) { rapidApiInput.value = atob(savedRapid); this.state.rapidApiKey = atob(savedRapid); }
        if (savedSymbol) { symbolInput.value = savedSymbol; this.state.targetSymbol = savedSymbol; }

        let timeout = null;
        const debouncedSave = () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                const gemVal = apiKeyInput.value.trim();
                const rapVal = rapidApiInput.value.trim();
                const symVal = symbolInput.value.trim().toUpperCase();

                if (gemVal) { sessionStorage.setItem('_sys_qt_auth', btoa(gemVal)); this.state.apiKey = gemVal; this.initializeRouter(); }
                if (rapVal) { sessionStorage.setItem('_sys_rapid_auth', btoa(rapVal)); this.state.rapidApiKey = rapVal; }
                if (symVal) { sessionStorage.setItem('_sys_target_sym', symVal); this.state.targetSymbol = symVal; symbolInput.value = symVal; }
            }, 800);
        };

        apiKeyInput.addEventListener('input', debouncedSave);
        rapidApiInput.addEventListener('input', debouncedSave);
        symbolInput.addEventListener('input', debouncedSave);

        this.renderUploadGrid();
      },

      getTfTheme(tfId) {
          return {
              m30: { text: 'text-gray-300', btnBg: 'bg-[#083344]', btnBorder: 'border-cyan-500/50', hover: 'hover:bg-[#164e63]' }
          }[tfId];
      },

      renderUploadGrid() {
        const grid = document.getElementById('upload-grid');
        grid.innerHTML = '';
        this.state.timeframes.forEach(tf => {
            const theme = this.getTfTheme(tf.id);
            grid.innerHTML += `
                <div class="relative flex flex-col p-4 border border-white/5 bg-black/30 rounded-xl transition-all duration-200 group h-[280px]" id="box-${tf.id}">
                    <div class="flex justify-between items-center mb-4">
                         <h4 class="font-bold text-gray-200 text-[11px] uppercase tracking-widest flex items-center gap-2">
                             <i data-lucide="hexagon" class="w-4 h-4 text-blue-500"></i> ${tf.title}
                         </h4>
                         <div class="text-[8px] px-2 py-1 rounded bg-zinc-800 text-gray-500 border border-white/5 uppercase font-bold tracking-wider transition-colors z-20 cursor-default" id="badge-${tf.id}" title="">EMPTY</div>
                    </div>
                    <div class="relative w-full flex-1 mb-4 border border-dashed border-white/10 rounded-lg overflow-hidden group/upload flex items-center justify-center transition-all duration-300 hover:border-white/30" id="upload-area-${tf.id}">
                        <label class="cursor-pointer flex flex-col items-center justify-center w-full h-full z-10" id="upload-label-${tf.id}" ondragover="AI_Quant_Engine.handleDragOver(event, '${tf.id}')" ondragleave="AI_Quant_Engine.handleDragLeave(event, '${tf.id}')" ondrop="AI_Quant_Engine.handleDrop(event, '${tf.id}')">
                            <i data-lucide="image-plus" class="w-6 h-6 text-gray-500 group-hover/upload:text-gray-400 transition-colors mb-2 pointer-events-none"></i>
                            <span class="text-[10px] font-mono text-gray-400 pointer-events-none">Upload / Drop M30 Chart</span>
                            <span class="text-[8px] text-gray-600 mt-1 pointer-events-none">PNG, JPG, WEBP (Max 10MB)</span>
                            <input type="file" class="hidden" accept="image/jpeg, image/png, image/webp" onchange="AI_Quant_Engine.handleUpload(event, '${tf.id}')">
                        </label>
                        <div id="preview-container-${tf.id}" class="hidden absolute inset-0 w-full h-full group/img bg-black">
                            <img id="preview-img-${tf.id}" class="w-full h-full object-cover opacity-60">
                            <div id="loader-${tf.id}" class="hidden absolute inset-0 bg-black/70 flex flex-col items-center justify-center z-30 backdrop-blur-[2px]">
                                <div class="w-6 h-6 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
                            </div>
                            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover/img:opacity-100 flex items-center justify-center gap-3 z-20 transition-opacity">
                                <label class="cursor-pointer bg-blue-500/80 p-2 rounded-lg hover:bg-blue-500 transition-colors" title="Replace">
                                    <i data-lucide="refresh-cw" class="w-4 h-4 text-white"></i>
                                    <input type="file" class="hidden" accept="image/jpeg, image/png, image/webp" onchange="AI_Quant_Engine.handleUpload(event, '${tf.id}')">
                                </label>
                                <button onclick="AI_Quant_Engine.removeImage('${tf.id}')" class="bg-red-500/80 p-2 rounded-lg hover:bg-red-500 transition-colors" title="Remove">
                                    <i data-lucide="trash-2" class="w-4 h-4 text-white"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button id="search-btn-${tf.id}" onclick="AI_Quant_Engine.handleSearch('${tf.id}')" disabled class="w-full py-2.5 rounded font-bold text-[10px] uppercase tracking-widest transition-all duration-300 bg-white/5 text-gray-500 border border-white/10 cursor-not-allowed flex items-center justify-center gap-2">
                        <i data-lucide="search" class="w-3.5 h-3.5"></i> SCAN HARMONIC
                    </button>
                    <div class="text-center mt-2 text-[9px] text-gray-600 font-mono" id="error-msg-${tf.id}">Analisis murni rasio Fibonacci</div>
                </div>
            `;
        });
        if (window.lucide) lucide.createIcons();
      },

      handleDragOver(event, tfId) { event.preventDefault(); event.stopPropagation(); document.getElementById(`upload-area-${tfId}`).classList.add('border-blue-500', 'bg-blue-500/10'); },
      handleDragLeave(event, tfId) { event.preventDefault(); event.stopPropagation(); document.getElementById(`upload-area-${tfId}`).classList.remove('border-blue-500', 'bg-blue-500/10'); },
      handleDrop(event, tfId) { event.preventDefault(); event.stopPropagation(); this.handleDragLeave(event, tfId); if (event.dataTransfer.files && event.dataTransfer.files.length > 0) this.processFile(event.dataTransfer.files[0], tfId); },

      async initializeRouter() {
        try {
            if (!this.state.apiKey) throw new Error("API Key kosong");
            const res = await fetch(`${this.config.providers[0].baseURL}/models?key=${this.state.apiKey}`);
            if (!res.ok) throw new Error(`HTTP ${res.status} - Invalid API Key`);
            const data = await res.json();
            const validModels = data.models.filter(m => m.supportedGenerationMethods?.includes("generateContent") && !m.name.includes("embedding") && (m.name.includes("gemini-1.5") || m.name.includes("gemini-2"))).map(m => m.name.split('/').pop());
            if (validModels.length === 0) throw new Error("Tidak ditemukan model yang mendukung Image Processing.");
            
            validModels.sort((a, b) => {
                const scoreA = a.includes("flash") ? 3 : a.includes("pro") ? 1 : 2;
                const scoreB = b.includes("flash") ? 3 : b.includes("pro") ? 1 : 2;
                return scoreB - scoreA;
            });

            this.state.activeModel = validModels[0];
        } catch (err) {
            this.state.activeModel = null; alert(`AI Engine Error: ${err.message}. Pastikan API Key valid.`);
        }
      },

      handleUpload(event, tfId) { if (!event.target.files || event.target.files.length === 0) return; this.processFile(event.target.files[0], tfId); event.target.value = ''; },

      processFile(file, tfId) {
        document.getElementById(`error-msg-${tfId}`).innerHTML = `Mengekstrak rasio Fibonacci...`;
        if (!file.type.match(/image\/(jpeg|png|webp)/)) { this.showError(tfId, "Format Invalid: Gunakan JPG/PNG/WEBP"); return; }
        if (file.size > 10 * 1024 * 1024) { this.showError(tfId, "Size Limit: Maksimal 10MB"); return; }
        if (this.state.tfControllers[tfId]) this.state.tfControllers[tfId].abort("REPLACED");
        
        this.state.tfMemory[tfId] = null; this.state.tfImages[tfId] = file; this.resetFinalReport();
        const reader = new FileReader();
        reader.onload = (e) => {
            const rawData = e.target.result;
            document.getElementById(`upload-label-${tfId}`).classList.add('hidden'); document.getElementById(`preview-container-${tfId}`).classList.remove('hidden');
            document.getElementById(`preview-img-${tfId}`).src = rawData;
            this.updateStatus(tfId, 'Loaded'); this.updateReadiness();
        };
        reader.readAsDataURL(file);
      },

      showError(tfId, msg) { document.getElementById(`error-msg-${tfId}`).innerHTML = `<span class="text-red-400 font-bold">${msg}</span>`; },

      async handleSearch(tfId) {
        const file = this.state.tfImages[tfId];
        if (!file) return;
        if (this.state.tfControllers[tfId]) this.state.tfControllers[tfId].abort("RESTARTED");
        await this.processTimeframe(tfId, file);
      },

      async processTimeframe(tfId, file) {
        const controller = new AbortController();
        this.state.tfControllers[tfId] = controller;

        this.updateStatus(tfId, 'Searching');
        document.getElementById(`loader-${tfId}`).classList.remove('hidden');
        const startTimer = performance.now();

        try {
            const rapidKey = this.state.rapidApiKey;
            const sym = this.state.targetSymbol;

            const [base64Image, realtimeData] = await Promise.all([
                this.optimizeImage(file),
                MarketConfirmationEngine.getRealtimeData(sym, rapidKey)
            ]);

            const aiResult = await this.requestAITimeframe(tfId, base64Image, realtimeData, controller);
            this.state.tfMemory[tfId] = aiResult;

            if (this.state.tfControllers[tfId] === controller) {
                const latency = ((performance.now() - startTimer) / 1000).toFixed(1);
                document.getElementById('mon-latency-val').textContent = `${latency}s`;
                this.updateStatus(tfId, 'Analysed');
                document.getElementById(`error-msg-${tfId}`).innerHTML = `<span class="text-green-400 font-bold">Analysis Success</span>`;
            }

        } catch (error) {
            const errStr = String(error.message || error);
            if (error.name === 'AbortError' || errStr.includes('REPLACED') || errStr.includes('RESTARTED') || errStr.includes('REMOVED')) {
                // Fail silently
            } else {
                console.error(`[Fatal Error] Logic Engine TF ${tfId}:`, error);
                if (this.state.tfControllers[tfId] === controller) {
                    this.updateStatus(tfId, 'Error', errStr.includes('TIMEOUT') ? 'TIMEOUT' : 'API ERROR');
                    this.showError(tfId, error.message || "Failed processing logic");
                }
            }
        } finally {
            if (this.state.tfControllers[tfId] === controller) {
                document.getElementById(`loader-${tfId}`).classList.add('hidden');
                this.updateReadiness();
            }
        }
      },

      async requestAITimeframe(tfId, base64Image, realtimeData, controller) {
          if (!this.state.activeModel) throw new Error("Model AI belum siap / API Key salah");

          let prompt = `Bertindaklah sebagai AI Harmonic Pattern Scanner khusus timeframe M30.\n\n`;
          prompt += `TUGAS UTAMA: Analisis HANYA pola Bullish Gartley, Bearish Gartley, Bullish Bat, dan Bearish Bat.\n`;
          prompt += `ATURAN KERAS: DILARANG melakukan analisis Support & Resistance, Trendline, SMC, ICT, Elliott Wave, Order Block, Supply & Demand, dan Entry Trading Umum.\n\n`;
          prompt += `LANGKAH ANALISIS:\n`;
          prompt += `1. Identifikasi Swing: Cari titik X -> A -> B -> C -> D yang paling logis dan bersih. JANGAN MENGARANG SWING.\n`;
          prompt += `2. Validasi Titik B: Gartley (B ~ 0.618 XA ±3%), Bat (B ~ 0.382-0.50 XA ±3%). Jika di luar rasio, nyatakan INVALID.\n`;
          prompt += `3. Validasi Titik C: C harus berada pada kisaran 0.382 - 0.786 AB. Jika di luar toleransi, nyatakan INVALID.\n`;
          prompt += `4. Tentukan PRZ & Titik D: Gartley (D ~ 0.786 XA, BC Proj 1.27-1.618), Bat (D ~ 0.886 XA, BC Proj 1.618-2.618).\n`;
          prompt += `5. Jika ada SATU syarat yang gagal, Status = INVALID. Jika semua terpenuhi, Status = VALID.\n\n`;
          
          if (realtimeData) {
              prompt += `Data Harga Realtime: \n${realtimeData}\nGunakan harga ini sebagai referensi konfirmasi harga terakhir terhadap area PRZ.\n\n`;
          }

          prompt += `KEMBALIKAN OUTPUT HANYA DALAM FORMAT JSON SESUAI SKEMA, TANPA BASA-BASI.`;

          const schema = { 
              type: "OBJECT", 
              properties: { 
                  jenisPattern: { type: "STRING", description: "Gartley / Bat / None" },
                  arah: { type: "STRING", description: "Bullish / Bearish / None" },
                  validitas: { type: "STRING", description: "VALID / INVALID" },
                  titikX: { type: "STRING", description: "Harga/Area X" },
                  titikA: { type: "STRING", description: "Harga/Area A" },
                  titikB: { type: "STRING", description: "Harga/Area B" },
                  titikC: { type: "STRING", description: "Harga/Area C" },
                  estimasiD: { type: "STRING", description: "Harga/Area D" },
                  zonaPRZ: { type: "STRING", description: "Rentang harga PRZ" },
                  rasioFibonacci: {
                      type: "OBJECT",
                      properties: {
                          XA: { type: "STRING", description: "Rasio retracement B terhadap XA" },
                          AB: { type: "STRING", description: "Rasio retracement C terhadap AB" },
                          BC: { type: "STRING", description: "Proyeksi BC (BC Projection)" },
                          CD: { type: "STRING", description: "Rasio retracement D terhadap XA" }
                      }
                  },
                  alasan: { type: "STRING", description: "Alasan teknis mengapa pattern valid atau invalid berdasarkan hitungan rasio" }
              },
              required: ["jenisPattern", "arah", "validitas", "titikX", "titikA", "titikB", "titikC", "estimasiD", "zonaPRZ", "rasioFibonacci", "alasan"]
          };

          const payload = {
              contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: 'image/jpeg', data: base64Image } }] }],
              generationConfig: { responseMimeType: "application/json", responseSchema: schema, temperature: 0.1 }
          };

          let attempt = 0; let success = false; let lastError = null;
          
          while (attempt < 3 && !success) {
              const timeoutId = setTimeout(() => { controller.abort("TIMEOUT"); }, this.config.timeoutMs);
              try {
                  const url = `${this.config.providers[0].baseURL}/models/${this.state.activeModel}:generateContent?key=${this.state.apiKey}`;
                  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: controller.signal });
                  clearTimeout(timeoutId);

                  if (!res.ok) {
                      if (res.status === 401 || res.status === 403) throw new Error("API Key Invalid / Forbidden");
                      if (res.status === 429) throw new Error("Rate Limit / Quota Habis (429)");
                      throw new Error(`HTTP ${res.status}: Network Error`);
                  }

                  const data = await res.json();
                  if (!data.candidates || !data.candidates[0].content) throw new Error("Gemini Response Empty");

                  let textRes = data.candidates[0].content.parts[0].text;
                  textRes = textRes.replace(/```json/gi, '').replace(/```/g, '').trim();
                  
                  try { success = true; return JSON.parse(textRes); } 
                  catch (parseErr) {
                      const match = textRes.match(/\{[\s\S]*\}/);
                      if (match) return JSON.parse(match[0]);
                      throw new Error("JSON Parse Failed");
                  }
              } catch (err) {
                  clearTimeout(timeoutId); attempt++; lastError = err;
                  if (err.name === 'AbortError' || err.message.includes("API Key") || err.message.includes("REPLACED")) throw err; 
                  if (attempt < 3) await new Promise(r => setTimeout(r, 2000 * attempt)); 
              }
          }
          throw lastError;
      },

      updateReadiness() {
        let completed = 0;
        this.state.timeframes.forEach(tf => { if (this.state.tfStatus[tf.id] === 'Analysed') completed++; });
        const percentage = (completed / 1) * 100;
        const bar = document.getElementById('readiness-bar'); const text = document.getElementById('readiness-text');
        
        bar.style.width = `${percentage}%`; text.innerText = `${percentage}%`;
        
        if (percentage === 100) {
            bar.classList.replace('bg-blue-500', 'bg-green-500'); text.classList.replace('text-white', 'text-green-400');
            this.renderFinalReportUI();
        } else {
            bar.classList.replace('bg-green-500', 'bg-blue-500'); text.classList.replace('text-green-400', 'text-white');
            this.resetFinalReport();
        }
      },
      
      resetFinalReport() {
          const container = document.getElementById('final-report-container');
          container.classList.add('opacity-0', 'translate-y-4'); setTimeout(() => container.classList.add('hidden'), 300);
      },

          const validBorder = isValid ? "border-green-500/30" : "border-red-500/30";

                      <h3 class="font-bold text-base sm:text-lg text-white uppercase tracking-widest pixel-font">PATTERN RESULT</h3>
                      <div class="${validBg} px-3 py-1 rounded border ${validBorder} font-black ${validColor} tracking-widest text-sm uppercase shadow-sm">

                      </div>
                  </div>

                      <div class="bg-white/5 p-3 rounded-lg border border-white/5 shadow-inner">
                          <span class="text-[9px] text-gray-500 uppercase font-bold tracking-wider">Pattern Type</span>
                          <div class="font-bold text-blue-400 text-sm mt-1">${data.jenisPattern}</div>
                      </div>
                      <div class="bg-white/5 p-3 rounded-lg border border-white/5 shadow-inner">
                          <span class="text-[9px] text-gray-500 uppercase font-bold tracking-wider">Direction</span>
                          <div class="font-bold text-white text-sm mt-1">${data.arah}</div>
                      </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-mono bg-black/50 p-4 rounded-lg border border-white/5">
                      <!-- Structural Points -->
                      <div class="space-y-2 border-r border-white/5 pr-4">
                          <span class="text-[10px] text-blue-400 font-bold uppercase block pb-2 border-b border-blue-400/20 mb-3"><i data-lucide="git-commit" class="w-3 h-3 inline mr-1"></i> Structure Points</span>
                          <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-gray-500">Point X:</span><span class="text-gray-200 font-bold">${data.titikX}</span></div>
                          <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-gray-500">Point A:</span><span class="text-gray-200 font-bold">${data.titikA}</span></div>
                          <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-gray-500">Point B:</span><span class="text-gray-200 font-bold">${data.titikB}</span></div>
                          <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-gray-500">Point C:</span><span class="text-gray-200 font-bold">${data.titikC}</span></div>
                          <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-gray-500">Estimated D:</span><span class="text-yellow-400 font-bold">${data.estimasiD}</span></div>
                          <div class="flex justify-between pt-1"><span class="text-gray-500">PRZ Zone:</span><span class="text-emerald-400 font-bold">${data.zonaPRZ}</span></div>
                      </div>

                      <!-- Fibonacci Ratios -->
                      <div class="space-y-2 pl-2">
                          <span class="text-[10px] text-purple-400 font-bold uppercase block pb-2 border-b border-purple-400/20 mb-3"><i data-lucide="activity" class="w-3 h-3 inline mr-1"></i> Fibonacci Ratios</span>
                          <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-gray-500">XA Retracement:</span><span class="text-white font-bold">${data.rasioFibonacci.XA}</span></div>
                          <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-gray-500">AB Retracement:</span><span class="text-white font-bold">${data.rasioFibonacci.AB}</span></div>
                          <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-gray-500">BC Projection:</span><span class="text-white font-bold">${data.rasioFibonacci.BC}</span></div>
                          <div class="flex justify-between pt-1"><span class="text-gray-500">CD / D Point:</span><span class="text-white font-bold">${data.rasioFibonacci.CD}</span></div>
                      </div>
                  </div>
              </div>

              <!-- AI Logical Reasoning -->
              <div class="col-span-full mt-2 ${validBg} border ${validBorder} p-4 rounded-xl flex items-start gap-4">
                  <div class="w-full">
                      <span class="text-[10px] ${validColor} font-bold uppercase block mb-1">Harmonic Reasoning & Validation</span>
                      <p class="text-gray-200 font-medium leading-relaxed">${data.alasan}</p>
                  </div>
              </div>
          `;
          
          const repContainer = document.getElementById('final-report-container');
          repContainer.classList.remove('hidden');
          if (window.lucide) lucide.createIcons();
          setTimeout(() => repContainer.classList.remove('opacity-0', 'translate-y-4'), 50);
      },

      removeImage(tfId) {
        if (this.state.tfControllers[tfId]) { this.state.tfControllers[tfId].abort("REMOVED"); this.state.tfControllers[tfId] = null; }
        this.state.tfMemory[tfId] = null; this.state.tfImages[tfId] = null;
        document.getElementById(`upload-label-${tfId}`).classList.remove('hidden'); document.getElementById(`preview-container-${tfId}`).classList.add('hidden'); document.getElementById(`preview-img-${tfId}`).src = '';
        document.getElementById(`error-msg-${tfId}`).innerHTML = `Analisis murni rasio Fibonacci`;
        this.updateStatus(tfId, 'Empty'); this.updateReadiness();
      },

      updateStatus(tfId, status, errorMsg = '') {
        this.state.tfStatus[tfId] = status; 
        const badge = document.getElementById(`badge-${tfId}`); 
        const btn = document.getElementById(`search-btn-${tfId}`); 
        const theme = this.getTfTheme(tfId); 
        
        badge.className = `absolute top-2 right-2 text-[8px] px-2 py-1 rounded font-mono font-bold uppercase tracking-wider transition-colors z-20 cursor-default`; badge.title = errorMsg; 

        if (status === 'Empty') { 
          badge.innerText = 'EMPTY'; 
          badge.className += ' bg-zinc-800 text-gray-500 border border-white/5'; 
          btn.disabled = true; 
          btn.innerHTML = `<i data-lucide="search" class="w-3.5 h-3.5"></i> SCAN HARMONIC`; 
          btn.className = "w-full py-2.5 rounded font-bold text-[10px] uppercase tracking-widest transition-all duration-300 flex items-center justify-center gap-2 border bg-white/5 text-gray-500 border-white/10 cursor-not-allowed"; 
        } 
        else if (status === 'Loaded') { 
          badge.innerText = 'LOADED'; 
          badge.className += ' bg-yellow-500/20 text-yellow-500 border border-yellow-500/50'; 
          btn.disabled = false; 
          btn.innerHTML = `<i data-lucide="search" class="w-3.5 h-3.5"></i> SCAN HARMONIC`; 
          btn.className = `w-full py-2.5 rounded font-bold text-[10px] uppercase tracking-widest transition-all duration-300 flex items-center justify-center gap-2 border ${theme.btnBg} ${theme.text} ${theme.btnBorder} ${theme.hover} cursor-pointer`; 
        } 
        else if (status === 'Searching') { 
          badge.innerText = 'SCANNING'; 
          badge.className += ' bg-blue-500/20 text-blue-400 border border-blue-500/50 animate-pulse'; 
          btn.disabled = true; 
          btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> CALCULATING FIBONACCI...`; 
          btn.className = `w-full py-2.5 rounded font-bold text-[10px] uppercase tracking-widest transition-all duration-300 flex items-center justify-center gap-2 border ${theme.btnBg} ${theme.text} border-white/20 cursor-not-allowed opacity-70`; 
        } 
        else if (status === 'Analysed') { 
          badge.innerText = 'SCANNED'; 
          badge.className += ' bg-green-500/20 text-green-400 border border-green-500/50'; 
          btn.disabled = false; 
          btn.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> RE-SCAN`; 
          btn.className = `w-full py-2.5 rounded font-bold text-[10px] uppercase tracking-widest transition-all duration-300 flex items-center justify-center gap-2 border bg-white/5 text-gray-300 border-white/20 hover:bg-white/10 cursor-pointer`; 
        }
        else if (status === 'Error') { 
          badge.innerText = 'ERROR'; 
          badge.className += ' bg-red-500/20 text-red-400 border border-red-500/50'; 
          btn.disabled = false; 
          btn.innerHTML = `<i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> RETRY SCAN`; 
          btn.className = `w-full py-2.5 rounded font-bold text-[10px] uppercase tracking-widest transition-all duration-300 flex items-center justify-center gap-2 border bg-red-950/50 text-red-400 border-red-500/50 hover:bg-red-900/60 cursor-pointer`; 
        }

        const checkWrapper = document.getElementById(`check-${tfId}`);
        if (checkWrapper) {
          const isAnalysed = (status === 'Analysed');
          const iconName = isAnalysed ? 'check-circle-2' : 'circle';
          checkWrapper.innerHTML = `<i data-lucide="${iconName}" class="w-3 h-3"></i> M30 CHART`;
          if (isAnalysed) {
            checkWrapper.className = "flex items-center gap-1.5 text-blue-400 transition-colors";
          } else {
            checkWrapper.className = "flex items-center gap-1.5 text-gray-600 transition-colors";
          }
        }
        if (window.lucide) lucide.createIcons();
      },

      async optimizeImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height, max = this.config.maxImageDimension;
                    if (w > max || h > max) { if (w > h) { h = Math.round((h * max) / w); w = max; } else { w = Math.round((w * max) / h); h = max; } }
                    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const base64Data = canvas.toDataURL('image/jpeg', this.config.imageQuality).split(',')[1];
                    if (!base64Data || base64Data.trim() === '') return reject(new Error("Base64 kosong"));
                    resolve(base64Data);
                };
                img.onerror = () => reject(new Error("File korup")); img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error("Gagal membaca file")); reader.readAsDataURL(file);
        });
      }
    };

    function updateDigitalClock() { const el = document.getElementById('digital-clock'); if (el) el.textContent = new Date().toISOString().slice(11, 19) + ' UTC'; }
    
    window.onload = async () => {
      lucide.createIcons();
      updateDigitalClock(); setInterval(updateDigitalClock, 1000);
      AI_Quant_Engine.init();
    };
  </script>
