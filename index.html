<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoltAgent / octa-analyzer · PWA Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg-canvas: #0d1117;
      --bg-surface: #161b22;
      --bg-subtle: #21262d;
      --border-default: #30363d;
      --border-muted: #21262d;
      --accent-emerald: #10b981;
      --accent-blue: #58a6ff;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --danger: #f85149;
      --warning: #d29922;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Global Header */
    .gh-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .repo-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .repo-owner { color: var(--accent-blue); text-decoration: none; }
    .repo-divider { color: var(--text-muted); }
    .repo-name { color: var(--text-primary); font-weight: 700; }
    .badge-public {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      border: 1px solid var(--border-default);
      padding: 2px 7px;
      border-radius: 12px;
      background: var(--bg-subtle);
    }

    /* Repository Navigation Tabs */
    .nav-tabs-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
      padding: 0 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .tab-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab-item:hover { color: var(--text-primary); }
    .tab-item.active {
      color: var(--text-primary);
      font-weight: 600;
      border-bottom-color: #f78166;
    }
    .tab-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* Container Area */
    .main-container {
      flex: 1;
      padding: 16px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    .notice-https {
      display: none;
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid var(--warning);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #e3b341;
      font-family: var(--font-mono);
    }
    .btn-local-link {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 12px;
      background: var(--accent-emerald);
      color: #000;
      font-weight: 700;
      border-radius: 6px;
      text-decoration: none;
      font-size: 11px;
    }

    .tab-pane { display: none; width: 100%; height: 100%; }
    .tab-pane.active { display: block; }
    iframe { width: 100%; height: calc(100vh - 130px); border: 1px solid var(--border-default); border-radius: 6px; background: var(--bg-canvas); }
  </style>
</head>
<body>

  <!-- Top GitHub Header -->
  <div class="gh-header">
    <div class="repo-breadcrumb">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="color:var(--text-muted)"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-1 1v.75a.75.75 0 0 1-1.5 0V2.5z"/></svg>
      <span class="repo-owner">VoltAgent</span>
      <span class="repo-divider">/</span>
      <span class="repo-name">octa-analyzer</span>
      <span class="badge-public">Public</span>
    </div>
  </div>

  <!-- Repository Navigation Tabs -->
  <div class="nav-tabs-bar">
    <button class="tab-item active" id="tab-btn-crypto" onclick="selectTab('crypto')">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25V1.75zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25H1.75z"/></svg>
      Crypto Radar
      <span class="tab-badge">Top 500</span>
    </button>
    <button class="tab-item" id="tab-btn-wifi" onclick="selectTab('wifi')">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0z"/></svg>
      Gateway Wi-Fi
      <span class="tab-badge">ZTE ACL</span>
    </button>
  </div>

  <!-- Main Content -->
  <div class="main-container">

    <div id="https-notice" class="notice-https">
      <strong>⚠️ HTTPS Mixed Content Detected</strong><br>
      GitHub Pages memblokir koneksi ke backend Termux lokal (`http://127.0.0.1:8765`).<br>
      <a href="http://127.0.0.1:8765" class="btn-local-link">🚀 Open in Local Termux Server (http://127.0.0.1:8765)</a>
    </div>

    <!-- Crypto Radar Pane -->
    <div id="pane-crypto" class="tab-pane active">
      <iframe src="/trading"></iframe>
    </div>

    <!-- Gateway Wi-Fi ZTE Pane -->
    <div id="pane-wifi" class="tab-pane">
      <iframe src="/swc/public.html"></iframe>
    </div>

  </div>

  <script>
    function selectTab(name) {
      document.getElementById("pane-crypto").classList.toggle("active", name === 'crypto');
      document.getElementById("pane-wifi").classList.toggle("active", name === 'wifi');
      
      document.getElementById("tab-btn-crypto").classList.toggle("active", name === 'crypto');
      document.getElementById("tab-btn-wifi").classList.toggle("active", name === 'wifi');
    }

    if (window.location.protocol === 'https:') {
      document.getElementById("https-notice").style.display = "block";
    }
  </script>
</body>
</html>
