<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octa-Analyzer · Unified Gateway</title>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600&display=swap');
    :root {
      --bg: #060911; --panel: #0d1322; --border: rgba(255, 255, 255, 0.08);
      --accent: #06b6d4; --text: #f3f4f6; --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 10px; min-height: 100vh; }
    
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px; margin-bottom: 10px;
    }
    .nav-tabs { display: flex; gap: 6px; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-radius: 7px; font-size: 12px; font-weight: 700; border: 1px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .nav-btn.active { background: rgba(6, 182, 212, 0.15); color: var(--accent); border-color: rgba(6, 182, 212, 0.3); }
    
    .notice-box {
      display: none; background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: 10px; padding: 14px; margin-bottom: 12px; color: #fca5a5; font-size: 12px;
    }
    .btn-open-local {
      display: inline-block; margin-top: 8px; padding: 8px 14px;
      background: #06b6d4; color: #000; font-weight: 800; font-size: 12px;
      border-radius: 6px; text-decoration: none;
    }

    .tab-content { display: none; height: calc(100vh - 75px); }
    .tab-content.active { display: block; }
    iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
  </style>

  <style id="design-md-tokens">
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap");
    :root {
      --bg-canvas: #0d1117;
      --bg-surface: #161b22;
      --bg-subtle: #21262d;
      --border-default: #30363d;
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --status-rose: #f85149;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --font-sans: "Inter", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
    body { background-color: var(--bg-canvas) !important; color: var(--text-primary) !important; font-family: var(--font-sans) !important; }
    .panel, div[style*="background:#0f172a"] { background: var(--bg-surface) !important; border-color: var(--border-default) !important; border-radius: 6px !important; }
    .btn { font-family: var(--font-sans); border-radius: 6px !important; border: 1px solid var(--border-default) !important; }
    code, table, .font-mono { font-family: var(--font-mono) !important; }
  </style>
  
</head>
<body>

  <div id="designMdHeader" style="background:var(--bg-surface,#161b22); border-bottom:1px solid #30363d; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:9999; font-family:'Inter',sans-serif;">
    <div style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;">
      <span style="color:#58a6ff;">VoltAgent</span>
      <span style="color:#6e7681;">/</span>
      <span style="color:#f0f6fc;">octa-analyzer</span>
      <span style="font-size:10px; font-family:'JetBrains Mono',monospace; padding:1px 6px; background:#21262d; border:1px solid #30363d; border-radius:10px; color:#8b949e;">DESIGN.md</span>
    </div>
    <div style="display:flex; gap:6px;">
      <button onclick="togglePwaView('crypto')" id="btnViewCrypto" style="padding:6px 12px; background:#21262d; color:#f0f6fc; border:1px solid #06b6d4; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;">📈 Crypto Radar</button>
      <button onclick="togglePwaView('wifi')" id="btnViewWifi" style="padding:6px 12px; background:#21262d; color:#8b949e; border:1px solid #30363d; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;">📶 Wi-Fi Gateway</button>
    </div>
  </div>
  <div id="wifiGatewayFrameContainer" style="display:none; width:100%; height:calc(100vh - 50px); background:#0d1117;">
    <iframe src="/swc/public.html" style="width:100%; height:100%; border:none;"></iframe>
  </div>
  

  <div class="top-nav">
    <div class="nav-tabs">
      <button class="nav-btn active" id="btn-wifi" onclick="switchTab('wifi')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Gateway Wi-Fi
      </button>
      <button class="nav-btn" id="btn-radar" onclick="switchTab('radar')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Radar Sinyal
      </button>
    </div>
  </div>

  <div id="https-warning" class="notice-box">
    <strong>⚠️ Akses GitHub Pages Terdeteksi (HTTPS Block)</strong><br>
    Browser memblokir backend Termux lokal karena diakses dari HTTPS.<br>
    <a href="http://127.0.0.1:8765" class="btn-open-local">🚀 Buka dari Server Lokal (http://127.0.0.1:8765)</a>
  </div>

  <div id="tab-wifi" class="tab-content active">
    <iframe id="frame-wifi" src="/swc/public.html"></iframe>
  </div>

  <div id="tab-radar" class="tab-content">
    <iframe id="frame-radar" src="/trading"></iframe>
  </div>

  <script>
    function switchTab(t) {
      document.getElementById("tab-wifi").classList.toggle("active", t === 'wifi');
      document.getElementById("tab-radar").classList.toggle("active", t === 'radar');
      document.getElementById("btn-wifi").classList.toggle("active", t === 'wifi');
      document.getElementById("btn-radar").classList.toggle("active", t === 'radar');
    }

    if (window.location.protocol === 'https:') {
      document.getElementById("https-warning").style.display = "block";
    }
  </script>

  <script>
    function togglePwaView(mode) {
      const mainEl = document.querySelector("main");
      const wifiContainer = document.getElementById("wifiGatewayFrameContainer");
      const btnC = document.getElementById("btnViewCrypto");
      const btnW = document.getElementById("btnViewWifi");
      
      if (mode === "crypto") {
        if (mainEl) mainEl.style.display = "block";
        if (wifiContainer) wifiContainer.style.display = "none";
        btnC.style.borderColor = "#06b6d4"; btnC.style.color = "#f0f6fc";
        btnW.style.borderColor = "#30363d"; btnW.style.color = "#8b949e";
      } else {
        if (mainEl) mainEl.style.display = "none";
        if (wifiContainer) wifiContainer.style.display = "block";
        btnW.style.borderColor = "#06b6d4"; btnW.style.color = "#f0f6fc";
        btnC.style.borderColor = "#30363d"; btnC.style.color = "#8b949e";
      }
    }
  </script>
  
</body>
</html>
