<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octa-Analyzer · Unified Gateway</title>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600&display=swap');
    :root {
      --bg: #060911; --panel: #0d1322; --border: rgba(255, 255, 255, 0.08);
      --accent: #06b6d4; --text: #f3f4f6; --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 10px; min-height: 100vh; }
    
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px; margin-bottom: 10px;
    }
    .nav-tabs { display: flex; gap: 6px; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-radius: 7px; font-size: 12px; font-weight: 700; border: 1px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .nav-btn.active { background: rgba(6, 182, 212, 0.15); color: var(--accent); border-color: rgba(6, 182, 212, 0.3); }
    
    .notice-box {
      display: none; background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: 10px; padding: 14px; margin-bottom: 12px; color: #fca5a5; font-size: 12px;
    }
    .btn-open-local {
      display: inline-block; margin-top: 8px; padding: 8px 14px;
      background: #06b6d4; color: #000; font-weight: 800; font-size: 12px;
      border-radius: 6px; text-decoration: none;
    }

    .tab-content { display: none; height: calc(100vh - 75px); }
    .tab-content.active { display: block; }
    iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="nav-tabs">
      <button class="nav-btn active" id="btn-wifi" onclick="switchTab('wifi')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Gateway Wi-Fi
      </button>
      <button class="nav-btn" id="btn-radar" onclick="switchTab('radar')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Radar Sinyal
      </button>
    </div>
  </div>

  <div id="https-warning" class="notice-box">
    <strong>⚠️ Akses GitHub Pages Terdeteksi (HTTPS Block)</strong><br>
    Browser memblokir backend Termux lokal karena diakses dari HTTPS.<br>
    <a href="http://127.0.0.1:8765" class="btn-open-local">🚀 Buka dari Server Lokal (http://127.0.0.1:8765)</a>
  </div>

  <div id="tab-wifi" class="tab-content active">
    <iframe id="frame-wifi" src="/swc/public.html"></iframe>
  </div>

  <div id="tab-radar" class="tab-content">
    <iframe id="frame-radar" src="/trading"></iframe>
  </div>

  <script>
    function switchTab(t) {
      document.getElementById("tab-wifi").classList.toggle("active", t === 'wifi');
      document.getElementById("tab-radar").classList.toggle("active", t === 'radar');
      document.getElementById("btn-wifi").classList.toggle("active", t === 'wifi');
      document.getElementById("btn-radar").classList.toggle("active", t === 'radar');
    }

    if (window.location.protocol === 'https:') {
      document.getElementById("https-warning").style.display = "block";
    }
  </script>
</body>
</html>
