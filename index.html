<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MEME COIN RADAR PRO (GMGN.AI)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    html, body { overflow-x: hidden; width: 100%; max-width: 100vw; background: #09090e; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #e2e8f0; }
    .pixel-font { font-family: 'Press Start 2P', monospace; }
    .neon-border-green { box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.25), 0 0 20px rgba(34, 197, 94, 0.08); }
    .glass-panel { background: rgba(13, 13, 23, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.04); }
    .price-up { color: #22c55e !important; }
    .price-down { color: #ef4444 !important; }
    
    /* Custom Scrollbar untuk container koin */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex items-start justify-center p-2 sm:p-4">

  <div class="w-full max-w-7xl space-y-4">
    
    <!-- HEADER -->
    <div class="glass-panel rounded-2xl p-4 border border-white/5 shadow-lg">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <div class="flex items-center gap-2 flex-wrap mb-1">
            <span class="text-blue-400 font-semibold tracking-wider pixel-font text-[10px] bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">MEME RADAR v2.0</span>
            <h1 class="text-white font-bold text-base tracking-wide uppercase">GMGN Smart Tracker</h1>
          </div>
          <p class="text-[11px] text-gray-400">Realtime On-Chain Analytics & Honeypot Detection</p>
        </div>
        <div class="text-left sm:text-right">
          <span class="text-[11px] text-gray-500 font-mono flex items-center sm:justify-end gap-1">
            <i data-lucide="clock" class="w-3 h-3 text-blue-400"></i> <span id="digital-clock">00:00:00 UTC</span>
          </span>
          <div id="app-network-status" class="text-[10px] text-yellow-400 font-bold mt-1 tracking-tight animate-pulse">● WAITING FOR SCAN...</div>
        </div>
      </div>
    </div>

    <!-- CONTROL PANEL -->
    <div class="glass-panel rounded-2xl p-4 sm:p-5 border border-white/5 space-y-4 shadow-lg">
      
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-white/10 pb-4">
        <div>
           <div class="flex items-center gap-2 mb-2">
            <span class="text-purple-400 font-semibold tracking-wider pixel-font text-[10px] bg-purple-500/10 px-2 py-0.5 rounded border border-purple-500/20">DATA SOURCE: GMGN.AI</span>
           </div>
           <h2 class="text-white font-bold text-sm tracking-wide uppercase flex items-center gap-2">
             <i data-lucide="radar" class="w-4 h-4 text-purple-400"></i> Filter Parameters
           </h2>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto font-mono">
            <!-- Pilihan Jaringan -->
            <div class="flex items-center gap-2 bg-black/60 px-3 py-2 rounded-xl border border-white/10 transition-colors focus-within:border-blue-500/50">
                <i data-lucide="network" class="w-4 h-4 text-gray-400"></i>
                <select id="chain-select" class="bg-transparent text-[11px] text-white focus:outline-none w-full sm:w-32 uppercase font-bold cursor-pointer">
                    <option value="sol" selected>Solana (SOL)</option>
                    <option value="base">Base (BASE)</option>
                    <option value="eth">Ethereum (ETH)</option>
                    <option value="bsc">Binance (BSC)</option>
                </select>
            </div>
            
            <!-- Pilihan Timeframe -->
            <div class="flex items-center gap-2 bg-black/60 px-3 py-2 rounded-xl border border-white/10 transition-colors focus-within:border-blue-500/50">
                <i data-lucide="timer" class="w-4 h-4 text-gray-400"></i>
                <select id="timeframe-select" class="bg-transparent text-[11px] text-white focus:outline-none w-full sm:w-24 uppercase font-bold cursor-pointer">
                    <option value="1h">1 Hour</option>
                    <option value="6h" selected>6 Hours</option>
                    <option value="24h">24 Hours</option>
                </select>
            </div>

            <!-- Tombol Scan -->
            <button id="btn-scan" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-bold px-4 py-2 rounded-xl border border-blue-400/50 transition-all shadow-[0_0_15px_rgba(37,99,235,0.4)] flex items-center justify-center gap-2 uppercase tracking-wider">
                <i data-lucide="search" class="w-4 h-4"></i> SCAN COINS
            </button>
        </div>
      </div>

      <div class="w-full flex justify-between items-center bg-[#0d0d12] border border-white/5 rounded-xl p-2 px-4 mb-2">
          <div class="text-[10px] font-mono text-gray-400 flex items-center gap-4">
             <span class="text-green-400"><i data-lucide="shield-check" class="w-3 h-3 inline"></i> Strict Mode: Not Honeypot & Verified</span>
          </div>
      </div>
    </div>

    <!-- HASIL SCAN (LIST KOIN) -->
    <div id="loading-indicator" class="hidden glass-panel rounded-2xl p-10 flex flex-col items-center justify-center border border-white/5">
        <i data-lucide="loader-2" class="w-8 h-8 text-blue-500 animate-spin mb-3"></i>
        <p class="text-sm font-mono text-gray-400 tracking-widest animate-pulse">FETCHING GMGN DATA...</p>
    </div>

    <div id="error-container" class="hidden glass-panel rounded-2xl p-6 border border-red-500/30 bg-red-500/10 text-center">
        <i data-lucide="alert-triangle" class="w-8 h-8 text-red-500 mx-auto mb-2"></i>
        <p id="error-message" class="text-xs font-mono text-red-400 font-bold uppercase"></p>
    </div>

    <div id="coin-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden">
        <!-- Kartu koin akan di-render di sini oleh JavaScript -->
    </div>

  </div>

  <script>
    // Update Jam
    function updateDigitalClock() { 
        const el = document.getElementById('digital-clock'); 
        if (el) el.textContent = new Date().toISOString().slice(11, 19) + ' UTC'; 
    }
    
    // =========================================================================
    // MEME COIN ENGINE (GMGN API)
    // =========================================================================
    const MemeCoinEngine = {
        state: {
            isLoading: false
        },

        init() {
            document.getElementById('btn-scan').addEventListener('click', () => {
                this.scanCoins();
            });
        },

        async scanCoins() {
            if (this.state.isLoading) return;
            
            const chain = document.getElementById('chain-select').value;
            const timeframe = document.getElementById('timeframe-select').value;
            
            this.setLoadingState(true);
            
            try {
                // Endpoint GMGN API (Ranking berdasarkan swaps)
                // Filter: not_honeypot, verified, renounced
                const gmgnUrl = `https://gmgn.ai/defi/quotation/v1/rank/${chain}/swaps/${timeframe}?orderby=swaps&direction=desc&filters[]=not_honeypot&filters[]=verified&filters[]=renounced`;
                
                // MENGGUNAKAN CORS PROXY KARENA DIJALANKAN DI BROWSER
                // Perhatian: Layanan proxy publik ini kadang tidak stabil. 
                // Jika error, coba ganti ke proxy lain (seperti corsproxy.io/? atau thingproxy.freeboard.io/fetch/)
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(gmgnUrl)}`;
                
                console.log("Fetching from:", gmgnUrl);
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const proxyData = await response.json();
                
                // allorigins membungkus hasil di dalam proxyData.contents (format string)
                const result = JSON.parse(proxyData.contents);

                if (result.code === 0 && result.data && result.data.rank) {
                    this.renderCoins(result.data.rank, chain);
                    this.updateUIStatus('DATA FETCHED SUCCESSFULLY', 'text-green-400');
                } else {
                    throw new Error(result.msg || "Struktur data dari GMGN tidak valid / Terkena Limit");
                }
            } catch (error) {
                console.error("Scan Error:", error);
                this.showError("Gagal Mengambil Data: " + error.message + ". (Jika ini CORS error, gunakan backend proxy)");
                this.updateUIStatus('FETCH FAILED', 'text-red-400');
            } finally {
                this.setLoadingState(false);
            }
        },

        renderCoins(coins, chain) {
            const container = document.getElementById('coin-list-container');
            container.innerHTML = '';
            
            if (coins.length === 0) {
                this.showError("Tidak ada koin yang sesuai kriteria saat ini.");
                return;
            }

            // Batasi hanya 12 koin teratas agar tidak berat
            const topCoins = coins.slice(0, 12);

            topCoins.forEach((coin, index) => {
                // Format angka (Volume & Market Cap)
                const volume = coin.volume ? '$' + this.formatNumber(coin.volume) : 'N/A';
                const marketCap = coin.fdv ? '$' + this.formatNumber(coin.fdv) : 'N/A';
                
                // Format perubahan harga (Persentase)
                const priceChange = coin.price_change_percent || 0;
                const priceClass = priceChange >= 0 ? 'text-green-400' : 'text-red-400';
                const priceIcon = priceChange >= 0 ? 'trending-up' : 'trending-down';

                // Tentukan level rekomendasi berdasarkan Smart Money (opsional, tergantung data dari GMGN)
                const smartBuys = coin.smart_buy_count || 0;
                let badgeHtml = '';
                if (index < 3) {
                    badgeHtml = `<span class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 px-2 py-0.5 rounded text-[9px] font-bold tracking-wider">TOP #${index + 1}</span>`;
                } else if (smartBuys > 0) {
                    badgeHtml = `<span class="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded text-[9px] font-bold tracking-wider">SMART BUY: ${smartBuys}</span>`;
                }

                const cardHtml = `
                    <div class="glass-panel p-4 rounded-xl border border-white/10 hover:border-blue-500/50 transition-all duration-300 group">
                        <div class="flex justify-between items-start mb-3 border-b border-white/5 pb-3">
                            <div class="flex items-center gap-3">
                                <img src="${coin.logo || 'https://via.placeholder.com/40/333/fff?text=?'}" onerror="this.src='https://via.placeholder.com/40/333/fff?text=?'" class="w-10 h-10 rounded-full border border-white/20 bg-black">
                                <div>
                                    <h3 class="text-white font-bold text-sm tracking-wide truncate w-32" title="${coin.name}">${coin.symbol}</h3>
                                    <p class="text-[10px] text-gray-500 uppercase">${chain}</p>
                                </div>
                            </div>
                            <div class="flex flex-col items-end">
                                ${badgeHtml}
                                <span class="text-[10px] bg-green-900/40 text-green-400 px-1.5 py-0.5 rounded mt-1 border border-green-500/20">SAFE</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 text-xs font-mono mb-3">
                            <div class="bg-black/40 p-2 rounded-lg border border-white/5">
                                <span class="text-[9px] text-gray-500 block mb-1">Volume</span>
                                <span class="text-gray-200 font-bold">${volume}</span>
                            </div>
                            <div class="bg-black/40 p-2 rounded-lg border border-white/5">
                                <span class="text-[9px] text-gray-500 block mb-1">Market Cap</span>
                                <span class="text-gray-200 font-bold">${marketCap}</span>
                            </div>
                            <div class="bg-black/40 p-2 rounded-lg border border-white/5 col-span-2 flex justify-between items-center">
                                <span class="text-[9px] text-gray-500">Price Change</span>
                                <span class="font-bold ${priceClass} flex items-center gap-1">
                                    <i data-lucide="${priceIcon}" class="w-3 h-3"></i> ${priceChange.toFixed(2)}%
                                </span>
                            </div>
                        </div>

                        <div class="flex justify-between items-center pt-2 border-t border-white/5">
                            <span class="text-[9px] text-gray-600 truncate w-32" title="${coin.address}">${coin.address.substring(0, 6)}...${coin.address.substring(coin.address.length - 4)}</span>
                            <a href="https://gmgn.ai/${chain}/token/${coin.address}" target="_blank" class="text-[9px] font-bold text-blue-400 hover:text-blue-300 flex items-center gap-1 bg-blue-500/10 px-2 py-1 rounded">
                                VIEW CHART <i data-lucide="external-link" class="w-3 h-3"></i>
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });

            container.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        },

        setLoadingState(isLoading) {
            this.state.isLoading = isLoading;
            const btn = document.getElementById('btn-scan');
            const loader = document.getElementById('loading-indicator');
            const container = document.getElementById('coin-list-container');
            const errBox = document.getElementById('error-container');

            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> SCANNING...`;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
                
                container.classList.add('hidden');
                errBox.classList.add('hidden');
                loader.classList.remove('hidden');
                this.updateUIStatus('FETCHING API...', 'text-yellow-400');
            } else {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="search" class="w-4 h-4"></i> SCAN COINS`;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                loader.classList.add('hidden');
            }
            if (window.lucide) lucide.createIcons();
        },

        showError(msg) {
            const errBox = document.getElementById('error-container');
            const errMsg = document.getElementById('error-message');
            errMsg.innerText = msg;
            errBox.classList.remove('hidden');
        },

        updateUIStatus(status, colorClass = 'text-yellow-400') {
            const statusEl = document.getElementById('app-network-status');
            if (statusEl) {
                statusEl.innerText = `● ${status}`;
                statusEl.className = `text-[10px] font-bold mt-1 tracking-tight ${colorClass}`;
            }
        },

        formatNumber(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(2) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(2) + 'K';
            return num.toFixed(2);
        }
    };

    window.onload = () => {
        lucide.createIcons();
        updateDigitalClock(); 
        setInterval(updateDigitalClock, 1000);
        MemeCoinEngine.init();
    };
  </script>
</body>
</html>
